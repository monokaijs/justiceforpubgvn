name: justiceforpubgvn

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: justiceforpubgvn
      POSTGRES_USER: justiceforpubgvn
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U justiceforpubgvn -d justiceforpubgvn"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - internal

  web:
    image: ghcr.io/monokaijs/justiceforpubgvn:main
    container_name: justiceforpubgvn-web
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://justiceforpubgvn:${POSTGRES_PASSWORD}@db:5432/justiceforpubgvn
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      TURNSTILE_HOSTNAME: justiceforpubgvn.com
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/support').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s
    networks:
      - internal
      - shared-network

networks:
  internal:
  shared-network:
    external: true

volumes:
  postgres_data:
