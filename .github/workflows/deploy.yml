name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/monokaijs/justiceforpubgvn:main
            ghcr.io/monokaijs/justiceforpubgvn:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Prepare SSH
        env:
          DEPLOY_SSH_KEY_B64: ${{ secrets.DEPLOY_SSH_KEY_B64 }}
        run: |
          test -n "$DEPLOY_SSH_KEY_B64"
          install -d -m 700 "$HOME/.ssh"
          printf '%s' "$DEPLOY_SSH_KEY_B64" | base64 --decode > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          cp .github/known_hosts "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Copy Compose file to server
        run: scp -o BatchMode=yes -o StrictHostKeyChecking=yes deploy/compose.yaml ubuntu@REDACTED_DEPLOY_HOST:/opt/justiceforpubgvn/compose.yaml.next

      - name: Authenticate server to GHCR
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: printf '%s' "$GHCR_TOKEN" | ssh -o BatchMode=yes -o StrictHostKeyChecking=yes ubuntu@REDACTED_DEPLOY_HOST 'docker login ghcr.io -u monokaijs --password-stdin'

      - name: Deploy image and check health
        run: |
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes ubuntu@REDACTED_DEPLOY_HOST 'bash -se' <<'REMOTE'
          set -eu
          cd /opt/justiceforpubgvn
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
          docker compose -f compose.yaml.next config --quiet
          mv compose.yaml.next compose.yaml
          docker compose pull web
          docker compose up -d --wait --wait-timeout 180
          docker exec xn-nginx nginx -t
          docker exec xn-nginx nginx -s reload
          docker compose ps
          REMOTE
